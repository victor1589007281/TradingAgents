# Kubernetes CronJob - 定时执行交易分析
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tradingagents-daily
  namespace: tradingagents
  labels:
    app.kubernetes.io/name: tradingagents
    app.kubernetes.io/component: cronjob
spec:
  # 每个工作日早上 9:00 (EST) 运行
  schedule: "0 14 * * 1-5"  # UTC 时间
  timeZone: "America/New_York"
  
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600  # 10 分钟超时
      
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tradingagents
            app.kubernetes.io/component: cronjob-pod
        spec:
          restartPolicy: OnFailure
          serviceAccountName: tradingagents
          
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          
          containers:
            - name: tradingagents
              image: tradingagents:latest
              imagePullPolicy: IfNotPresent
              
              command: ["/app/tradingagents"]
              args:
                - "run"
                - "--ticker"
                - "NVDA"
                - "--date"
                - "$(date +%Y-%m-%d)"
              
              env:
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tradingagents-secrets
                      key: OPENAI_API_KEY
                - name: ALPHA_VANTAGE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tradingagents-secrets
                      key: ALPHA_VANTAGE_API_KEY
                      optional: true
              
              resources:
                requests:
                  cpu: "200m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              
              volumeMounts:
                - name: config-volume
                  mountPath: /app/config
                  readOnly: true
                - name: results-volume
                  mountPath: /app/results
          
          volumes:
            - name: config-volume
              configMap:
                name: tradingagents-config
            - name: results-volume
              emptyDir: {}

---
# CronJob for multiple tickers
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tradingagents-portfolio
  namespace: tradingagents
  labels:
    app.kubernetes.io/name: tradingagents
    app.kubernetes.io/component: portfolio-cronjob
spec:
  schedule: "30 14 * * 1-5"  # 每个工作日 UTC 14:30
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: tradingagents
          
          initContainers:
            # 分析多个股票
            - name: analyze-nvda
              image: tradingagents:latest
              command: ["/app/tradingagents", "run", "--ticker", "NVDA"]
              envFrom:
                - secretRef:
                    name: tradingagents-secrets
            
            - name: analyze-aapl
              image: tradingagents:latest
              command: ["/app/tradingagents", "run", "--ticker", "AAPL"]
              envFrom:
                - secretRef:
                    name: tradingagents-secrets
            
            - name: analyze-googl
              image: tradingagents:latest
              command: ["/app/tradingagents", "run", "--ticker", "GOOGL"]
              envFrom:
                - secretRef:
                    name: tradingagents-secrets
          
          containers:
            - name: summary
              image: busybox
              command: ["echo", "Portfolio analysis completed"]
