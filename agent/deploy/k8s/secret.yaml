# Kubernetes Secret
# 注意：实际部署时请使用 kubectl create secret 或 sealed-secrets
apiVersion: v1
kind: Secret
metadata:
  name: tradingagents-secrets
  namespace: tradingagents
  labels:
    app.kubernetes.io/name: tradingagents
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # OpenAI API Key (替换为实际值或使用 external-secrets)
  OPENAI_API_KEY: "your-openai-api-key-here"
  
  # Alpha Vantage API Key (可选)
  ALPHA_VANTAGE_API_KEY: "your-alpha-vantage-api-key-here"

---
