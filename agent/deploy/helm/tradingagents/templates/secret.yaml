{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tradingagents.fullname" . }}-secrets
  labels:
    {{- include "tradingagents.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- else }}
  OPENAI_API_KEY: "REPLACE_ME"
  {{- end }}
  {{- if .Values.secrets.alphaVantageApiKey }}
  ALPHA_VANTAGE_API_KEY: {{ .Values.secrets.alphaVantageApiKey | quote }}
  {{- end }}
{{- end }}
